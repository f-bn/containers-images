---
name: Build ClickHouse image
on:
  push:
    branches:
      - main
    paths:
      - 'clickhouse/**'
      - '!clickhouse/README.md'
      - '.github/workflows/build-clickhouse.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Build and push image
        uses: ./.github/actions/build-image
        with:
          name: clickhouse
          version: 26.7.3.19
          description: Custom ClickHouse image built from official static binaries (stable release)
          license: Apache-2.0
          token: ${{ secrets.GITHUB_TOKEN }}
